slam_toolbox:
  ros__parameters:
    # --- GENERAL ---
    use_sim_time: false
    mode: mapping  # ou 'localization' pour mode localisé
    scan_topic: /scan
    scan_queue_size: 50  # Increase queue to handle high scan rate (30 FPS)
    odom_topic: /odom_rf2o
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    
    # --- SOLVER ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    
    # --- LOOP CLOSURE ---
    loop_search_maximum_distance: 3.0  # Chercher fermeture jusqu'à 3m
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_queue_size: 10
    loop_match_minimum_response_fine: 0.1
    loop_match_minimum_response_coarse: 0.35
    minimum_score_variance: 0.000001
    
    # --- SCAN MATCHING ---
    use_scan_matching: true
    use_response_expansion: true
    minimum_travel_distance: 0.05  # Traiter scan tous les 5cm
    minimum_travel_heading: 0.05
    minimum_time_interval: 0.1  # Process scans at most every 100ms (10 Hz)
    
    # --- COARSE SEARCH ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03
    loop_search_space_dimension: 8.0
    
    # --- COARSE ANGLE ---
    coarse_search_angle_offset: 0.35
    coarse_angle_resolution: 0.0349  # ~2 degrés
    coarse_search_angle_offset_fine: 0.1
    fine_angle_resolution: 0.00873  # ~0.5 degrés
    
    # --- PENALTIES (Important: faibles pour laisser le SLAM corriger RF2O) ---
    angle_variance_penalty: 0.001
    distance_variance_penalty: 0.001
    
    # --- OCCUPANCY GRID ---
    resolution: 0.05  # 5cm par pixel
    map_update_threshold: 1  # Update map when scan count reaches this
    stack_size_to_publish: 1
    
    # --- OPTIMIZATION ---
    max_iterations: 10
    max_solver_iterations: 100
    outlier_ratio: 0.55
    outlier_occupy_value: 100
    outlier_free_value: 255
    occupied_threshold: 65
    free_threshold: 25
    
    # --- STABILIZATION ---
    tf_buffer_duration: 60.0  # Increased from 30 to handle startup delays
    transform_timeout: 0.5  # Increased from 0.2 for more tolerance
    enable_interactive_mode: false  # Désactiver en robotique autonome
    
    # --- DEBUG ---
    # set this to subscribe to the localization pose
    set_initial_pose: false

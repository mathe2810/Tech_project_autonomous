slam_toolbox:
  ros__parameters:
    # --- GENERAL ---
    use_sim_time: false
    mode: mapping
    scan_topic: /scan
    odom_topic: /odom_rf2o  # ← UTILISE DIRECTEMENT RF2O!
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_queue_size: 20  # Réduit pour traiter plus vite
    
    # --- SOLVER AGRESSIF ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    
    # --- MAP UPDATE RAPIDE ---
    map_update_interval: 0.5  # Update toutes les 0.5 secondes (rapide!)
    resolution: 0.05  # 5cm par pixel
    
    # --- SCAN MATCHING AGRESSIF (pour corridors serrés) ---
    use_scan_matching: true
    use_response_expansion: true
    minimum_travel_distance: 0.02  # Traite tous les 2cm (très agressif)
    minimum_travel_heading: 0.02   # Traite tous les 2° (~1.15°)
    minimum_time_interval: 0.05    # Process at 20 Hz max
    
    # --- LOOP CLOSURE (désactivé pour stabilité) ---
    do_loop_closing: false  # Désactivé pour éviter reset graphe
    
    # --- SEARCH SPACE (adapté aux corridors) ---
    correlation_search_space_dimension: 0.3  # Réduit (corridors = moins d'ambiguïté)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.02
    
    # --- ANGLE SEARCH (rotation pure supportée) ---
    coarse_search_angle_offset: 0.5        # Large pour rotation pure
    coarse_angle_resolution: 0.0349        # ~2 degrés
    fine_search_angle_offset: 0.15         # Fine search sur 15°
    fine_angle_resolution: 0.00873         # ~0.5 degrés
    
    # --- VARIANCE PENALTIES (faible = confiance aux scans) ---
    angle_variance_penalty: 0.0001    # Très faible pour corriger angle agressivement
    distance_variance_penalty: 0.001  # Faible pour suivre RF2O
    
    # --- OPTIMIZATION (rapide et efficace) ---
    max_iterations: 5       # Réduit pour vitesse
    num_threads: 4          # Parallélisation
    
    # --- LINK MATCHING (évite graphe complexe) ---
    link_match_minimum_response_fine: 0.7    # Plus strict
    link_scan_maximum_distance: 1.5          # Liens courts seulement
    
    # --- STABILIZATION ---
    tf_buffer_duration: 30.0
    transform_timeout: 0.5
    
    # --- DEBUG ---
    debug_logging: false
    
    # --- THROTTLE (évite surcharge) ---
    throttle_scans: 1  # Process chaque scan
    
    # --- OCCUPANCY GRID ---
    occupied_threshold: 65   # Seuil pour obstacle
    free_threshold: 25       # Seuil pour libre

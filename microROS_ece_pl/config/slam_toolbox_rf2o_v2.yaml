slam_toolbox:
  ros__parameters:
    # --- SOLVER ---
    solver_plugin: solver_plugins::CeresSolver
    max_iterations: 20             # Un peu plus pour bien fermer la boucle
    huber_scale: 0.001
    
    # --- FRAMES ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # --- ANTI-RESET ---
    do_loop_closing: false         
    
    # --- PRÉCISION ---
    use_scan_matching: true
    # Puisque RF2O est précis, on peut baisser ces pénalités
    angle_variance_penalty: 0.5    
    distance_variance_penalty: 0.5 
    
    # Recherche dense pour recaler les derniers centimètres
    coarse_search_angle_offset: 0.8
    coarse_angle_resolution: 0.01  
    correlation_search_space_dimension: 1.5

    # --- DYNAMIQUE (Fréquence élevée pour RF2O) ---
    minimum_time_interval: 0.05     
    minimum_travel_distance: 0.05   
    minimum_travel_heading: 0.02    

    # --- NETTETÉ ---
    resolution: 0.03               
    map_update_interval: 1.0       

    # --- SYNCHRO ---
    transform_timeout: 0.5         # On laisse un peu plus de temps pour la synchro TF
    tf_buffer_duration: 10.0
    scan_buffer_size: 15
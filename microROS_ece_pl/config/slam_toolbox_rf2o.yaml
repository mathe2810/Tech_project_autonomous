slam_toolbox:
  ros__parameters:
    use_sim_time: false
    
    # === MESSAGE FILTER & QUEUE MANAGEMENT ===
    scan_queue_size: 20
    throttle_scans: 1            # Back to processing every scan
    rviz_transmit_queue_size: 0
    
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    transform_publish_period: 0.02
    map_update_interval: 2.0
    
    # === SOLVER CONFIG ===
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    
    # === CONVERGENCE & STABILITY ===
    resolution: 0.05
    max_laser_range: 5.0
    min_laser_range: 0.15
    
    # === SCAN MATCHING (maximize LIDAR trust) ===
    use_scan_matching: true
    use_scan_barycenter: true
    
    # More frequent updates = more LIDAR data processed
    minimum_travel_distance: 0.1      # Lower = more frequent LIDAR scans
    minimum_travel_heading: 0.1       # Lower = more frequent updates
    
    scan_buffer_size: 30
    
    # === LOOP CLOSURE (detect when revisiting areas) ===
    do_loop_closing: true
    loop_search_maximum_distance: 3.0      # Larger = detect more loops
    loop_match_minimum_chain_size: 4
    loop_match_maximum_variance_queue_size: 5
    loop_match_minimum_response_fine: 0.1
    loop_match_minimum_response_coarse: 0.3
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    
    publish_pose_graph: true
    publish_tf: true
    enable_interactive_mode: true

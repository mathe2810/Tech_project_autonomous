slam_toolbox:
  ros__parameters:
    # --- 1. ALIGNEMENT LIDAR (Supprime les WARNINGS de range) ---
    # Ton script Python dit 0.1 et 5.0, donc on met EXACTEMENT pareil ici
    max_laser_range: 5.0             
    minimum_time_interval: 0.0001    # Ne pas filtrer les scans par le temps
    
    # --- 2. LE SOLVEUR (On laisse Ceres faire sa vie avec ses 50 threads) ---
    solver_plugin: solver_plugins::CeresSolver
    do_loop_closure: true
    
    # --- 3. TON RÉGLAGE D'ANGLE FAVORI (Réactivité max) ---
    use_odometry: true
    minimum_travel_distance: 0.0     
    minimum_travel_heading: 0.0      
    angle_variance_penalty: 2.0      
    distance_variance_penalty: 0.1

    # --- 4. CONFIGURATION DES FRAMES ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # --- 5. PERFORMANCES ET MÉMOIRE ---
    # On augmente le buffer pour que Ceres ne bloque pas le flux
    scan_buffer_size: 50
    stack_size_to_use: 150000000     
    resolution: 0.05
    
    # --- 6. TIMING ---
    publish_period: 0.02             
    transform_publish_period: 0.02
    transform_timeout: 0.2
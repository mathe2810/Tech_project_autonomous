slam_toolbox:
  ros__parameters:
    # Core frames and topics
    scan_topic: /scan
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    
    # Publishing
    map_publish_period: 5.0  # Publish map every 5 seconds
    
    # Buffer sizes
    scan_queue_size: 200
    
    # SLAM mode - CRITICAL for RF2O!
    mode: mapping
    async_mode: true
    
    # Occupancy grid
    resolution: 0.05  # 5cm cells (larger = faster)
    map_start_angle: 0.0
    map_end_angle: 6.28  # Full 360 degrees
    
    # Matching - very permissive for RF2O
    correlation_response_threshold: 0.05  # Lower = more lenient
    loop_search_space_dimension: 8.0
    do_loop_closing: false  # Disable for now
    
    minimum_travel_distance: 0.001
    minimum_travel_heading: 0.001
    
    # Constraints
    max_beams_to_match: 500  # Process more beams
    max_iterations: 20
    transform_tolerance: 1.0
    tf_buffer_duration: 10.0
    
    # Solver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    
    # Processing
    use_scan_matching: true
    use_scan_barycenter: true

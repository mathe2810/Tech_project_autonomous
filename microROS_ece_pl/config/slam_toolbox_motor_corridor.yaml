slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    scan_topic: /scan
    odom_topic: /odom
    odom_frame: odom
    base_frame: base_link
    map_frame: map

    solver_plugin: solver_plugins::CeresSolver
    max_iterations: 40
    num_threads: 4

    map_update_interval: 0.15
    resolution: 0.05

    use_scan_matching: true
    use_response_expansion: true
    throttle_scans: 1
    minimum_travel_distance: 0.01
    minimum_travel_heading: 0.01
    minimum_time_interval: 0.03

    angle_variance_penalty: 0.2
    distance_variance_penalty: 0.2
    coarse_search_angle_offset: 0.8
    coarse_angle_resolution: 0.01
    fine_search_angle_offset: 0.2
    fine_angle_resolution: 0.003
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    do_loop_closing: false

    tf_buffer_duration: 60.0
    transform_timeout: 2.0

    debug_logging: false

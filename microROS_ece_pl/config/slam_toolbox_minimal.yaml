slam_toolbox:
  ros__parameters:
    mode: mapping
    scan_topic: /scan
    base_frame: base_link
    odom_frame: odom
    map_frame: map

    # -------------------------------------------------------
    # Scan matching pur - sans odom
    # -------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true

    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    minimum_time_interval: 0.0    # Traite CHAQUE scan sans délai minimum

    throttle_scans: 1

    # -------------------------------------------------------
    # Solver
    # -------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    max_iterations: 150           # Augmenté 100→150: plus d'itérations pour convergence robuste
    num_threads: 4

    # -------------------------------------------------------
    # Fenêtre de recherche - agressive pour rotation rapide
    # -------------------------------------------------------
    # Coarse : couvre jusqu'à 90° de rotation entre deux scans
    coarse_search_angle_offset: 1.570   # 90 deg
    coarse_angle_resolution: 0.0087     # 0.5 deg - résolution fine pour ne pas rater

    # Fine : affinage précis après coarse
    fine_search_angle_offset: 0.0698    # 4 deg

    # -------------------------------------------------------
    # Pénalités
    # -------------------------------------------------------
    distance_variance_penalty: 0.5        # AUGMENTÉ 0.3→0.5: très strict linéaire
    angle_variance_penalty: 2.0           # AUGMENTÉ 1.5→2.0: très strict angle
    response_distance_variance_penalty: 0.3

    # Bas = accepte des matchs partiels pendant une rotation
    minimum_response: 0.60         # TRÈS HAUT 0.40→0.60: rejette quasi tous les matchs faibles

    use_response_expansion: true

    # -------------------------------------------------------
    # Carte
    # -------------------------------------------------------
    resolution: 0.05
    map_update_interval: 1.0       # Réduit 0.1→1.0 (update chaque seconde quand pauses)

    # -------------------------------------------------------
    # Loop closing - ULTRA CONSERVATEUR (évite fausses détections)
    # -------------------------------------------------------
    do_loop_closing: true                            # Activé mais très strict
    loop_search_maximum_distance: 0.5                # RÉDUIT: cherche boucles < 50cm (très proche!)
    loop_match_minimum_response_coarse: 0.80         # TRÈS HAUT: 80% confiance minimum
    loop_match_minimum_response_fine: 0.90           # ULTRA HAUT: 90% confiance fine matching
CLaserOdometry2DNode:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 30.0                      # ⬆️ AUGMENTÉ - plus de mises à jour = plus précis
    publish_tf: true
    max_linear_speed: 1.0
    max_angular_speed: 3.0
    max_iterations: 50              # ⬆️ AUGMENTÉ pour convergence optimale
    tolerance: 1e-7                 # Plus strict pour précision maximale
    motion_filter_linear: 0.001     # ⬇️ TRÈS SENSIBLE - capture tout (1mm)
    motion_filter_angular: 0.001    # ⬇️ TRÈS SENSIBLE - capture tout (0.057°)
    max_laser_range: 6.0            # Full range from our simulator
    debug: true
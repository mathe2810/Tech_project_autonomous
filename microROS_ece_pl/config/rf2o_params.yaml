CLaserOdometry2DNode:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 20.0
    publish_tf: true
    max_linear_speed: 1.0
    max_angular_speed: 3.0
    max_iterations: 100
    
    # --- OPTIMISATION ---
    # 300 itérations c'est trop, ça peut créer du lag CPU qui décale les scans. 
    # 30 à 50 itérations suffisent amplement si le LiDAR est propre.
    max_iterations: 50           # Moins d'itérations pour éviter le lag et le drift
    tolerance: 1e-6              # Encore plus strict pour éviter le drift
    
    # --- FILTRES ANTI-DRIFT (Ajoute ces lignes si possible) ---
    motion_filter_linear: 0.04   # Ignore les corrections sur petits déplacements (4cm)
    motion_filter_angular: 0.02  # Ignore les corrections sur petites rotations (1.2°)
    max_laser_range: 1.2         # Limite la portée pour éviter le bruit
    debug: true
    verbose: true
    num_threads: 12
CLaserOdometry2DNode:
  ros__parameters:
    # Scan topic
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    base_frame_id: base_link
    odom_frame_id: odom
    
    # Don't wait for external pose - RF2O initializes from first scan
    init_pose_from_topic: ""
    
    # Processing - ULTRA REACTIVE MODE
    freq: 40.0                   # Match LiDAR rate for instant reaction
    publish_tf: false
    
    # Motion estimation - OPTIMAL VALUES (tested empirically)
    max_linear_speed: 0.25   # m/s - realistic maximum
    max_angular_speed: 2.0   # rad/s (~115°/s) - allows up to 1.5 rad/s operation
    
    # Optimization - PRECISION MODE
    max_iterations: 300          # More iterations = better convergence
    tolerance: 1e-7              # Higher precision

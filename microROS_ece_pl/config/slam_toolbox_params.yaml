slam_toolbox:
  ros__parameters:
    use_sim_time: true
    
    scan_queue_size: 5
    throttle_scans: 2
    
    mode: localization
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    transform_publish_period: 0.02
    map_update_interval: 0.3
    
    # === SOLVER CONFIG ===
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    
    # === CONVERGENCE & STABILITY ===
    resolution: 0.025
    max_laser_range: 5.0
    min_laser_range: 0.15
    
    use_scan_matching: true
    use_scan_barycenter: true
    # Threshold before processing - small movements accumulate before SLAM update
    minimum_travel_distance: 0.01       # 1cm movement threshold (update plus fréquent)
    minimum_travel_heading: 0.15        # 0.15 rad = 8.6 degrees threshold
    
    scan_buffer_size: 60
    
    # === LOOP CLOSURE (aggressive to prevent drift) ===
    do_loop_closing: false
    loop_search_maximum_distance: 2.0
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_queue_size: 5
    loop_match_minimum_response_fine: 0.1
    loop_match_minimum_response_coarse: 0.3
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    
    publish_pose_graph: false
    publish_tf: true
    enable_interactive_mode: true

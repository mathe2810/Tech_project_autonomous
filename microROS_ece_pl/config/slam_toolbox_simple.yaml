slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    
    # Topics
    scan_topic: /scan
    odom_topic: /odom_motor
    odom_frame: odom
    base_frame: base_link
    map_frame: map

    # Solver - FAST MODE
    solver_plugin: solver_plugins::CeresSolver
    max_iterations: 10
    num_threads: 4

    # Map settings - update less often
    resolution: 0.05
    map_update_interval: 1.0

    # Scan matching - aggressive throttle
    use_scan_matching: true
    throttle_scans: 3
    
    # Only update when robot moves enough
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.15
    minimum_time_interval: 0.2

    # Angle search - simpler
    angle_variance_penalty: 0.2
    distance_variance_penalty: 0.2
    
    coarse_search_angle_offset: 0.8
    coarse_angle_resolution: 0.02
    fine_search_angle_offset: 0.2
    fine_angle_resolution: 0.01
    
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.03

    # No loop closing
    do_loop_closing: false

    # TF
    tf_buffer_duration: 20.0
    transform_timeout: 0.5

    debug_logging: false

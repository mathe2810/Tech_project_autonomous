slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    scan_topic: /scan
    map_topic: /map
    odom_topic: /odom_ground_truth
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_queue_size: 30
    
    solver_plugin: solver_plugins::CeresSolver
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    map_update_interval: 0.5
    resolution: 0.05

    use_scan_matching: false
    throttle_scans: 1
    use_response_expansion: true
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.02
    minimum_time_interval: 0.10

    do_loop_closing: true

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.1

    coarse_search_angle_offset: 0.8
    coarse_angle_resolution: 0.0262
    fine_search_angle_offset: 0.3
    fine_angle_resolution: 0.00436

    angle_variance_penalty: 0.5
    distance_variance_penalty: 0.5

    max_iterations: 30
    num_threads: 4

    link_match_minimum_response_fine: 0.5
    link_scan_maximum_distance: 2.0

    tf_buffer_duration: 300.0
    transform_timeout: 5.0

    occupied_threshold: 65
    free_threshold: 25

    debug_logging: false
    log_raw_scans: false
    log_matching_matrices: false
